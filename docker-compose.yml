name: tts

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      cache_from:
        - alikberova/texttospeech.api:${IMAGE_TAG_VERSION}
      args:
        API_NAME: TextToSpeech.Api
    image: alikberova/texttospeech.api:${IMAGE_TAG_VERSION}
    env_file: ${OVERRIDE_ENV_FILE:-.env}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      IsTestMode: ${IsTestMode}
      ASPNETCORE_URLS: "http://+:80"
      AppDataPath: /app/data
      RabbitMq__RabbitMqConnection__HostName: rabbitmq
      RabbitMq__RabbitMqConnection__Port: 5672
      RabbitMq__RabbitMqConnection__UserName: ${RABBITMQ_USER}
      RabbitMq__RabbitMqConnection__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__RabbitMqConnection__VirtualHost: /
    volumes:
      - artifacts-data:/app/data
    container_name: api
    ports:
      - "7058:80"
    networks:
      - proxy_elk
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: TextToSpeech.Web
      dockerfile: ../docker/web.Dockerfile
      args:
        ANGULAR_ENVIRONMENT: ${ANGULAR_ENVIRONMENT}
      cache_from:
        - alikberova/texttospeech.web:${IMAGE_TAG_VERSION}
    image: alikberova/texttospeech.web:${IMAGE_TAG_VERSION}
    container_name: web
    ports:
      - "80:80" # redirects to https in nginx
      - "${ANGULAR_PORT}:443" # for tests ANGULAR_PORT should be the same as in selenium tests; 443 for prod
    volumes:
      - "${CERTS_PATH}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro"
      - "${CERTS_PATH}/privkey.pem:/etc/nginx/certs/privkey.pem:ro"
    networks:
      - proxy_elk
    depends_on:
      api:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    networks:
      - proxy_elk
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - proxy_elk
    restart: always

  db:
    image: postgres:18-alpine
    container_name: db
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - proxy_elk
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy_elk:
    external: true
    name: elk

volumes:
  rabbitmq-data:
  artifacts-data:
  redis-data:
  db-data:
