# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/TextToSpeech.Web"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    versioning-strategy: increase
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
          - "angular-eslint"
        update-types:
          - "minor"
          - "patch"

      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"

      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"

    # Major frontend upgrades often require coordinated package changes or code migrations.
    # Keep them out of automatic Dependabot PRs and handle them explicitly.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "angular-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript-eslint/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ngx-translate/core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nuget"
    directories:
      - "/TextToSpeech.Api"
      - "/TextToSpeech.Core"
      - "/TextToSpeech.Infra"
      - "/TextToSpeech.UnitTests"
      - "/TextToSpeech.IntegrationTests"
      - "/TextToSpeech.SeleniumTests"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "Selenium.WebDriver.ChromeDriver"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
