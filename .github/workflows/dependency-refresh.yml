name: One-time dependency refresh

on:
  push:
    branches:
      - maintenance/dependency-refresh
    paths:
      - .github/workflows/dependency-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Run dependency refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          ref: maintenance/dependency-refresh

      - name: Update Angular 21 dependencies
        working-directory: TextToSpeech.Web
        run: |
          npm ci
          npx ng update @angular/core@21 @angular/cli@21 @angular/material@21 --allow-dirty
          npm audit fix || true

      - name: Update NuGet dependencies
        run: |
          dotnet add TextToSpeech.Infra/TextToSpeech.Infra.csproj package MailKit --version 4.16.0
          dotnet add TextToSpeech.Infra/TextToSpeech.Infra.csproj package MimeKit --version 4.16.0
          dotnet add TextToSpeech.Infra/TextToSpeech.Infra.csproj package System.Security.Cryptography.Xml --version 10.0.10
          dotnet add TextToSpeech.Api/TextToSpeech.Api.csproj package Microsoft.OpenApi --version 2.7.5
          dotnet add TextToSpeech.IntegrationTests/TextToSpeech.IntegrationTests.csproj package SSH.NET --version 2026.0.0
          dotnet restore TextToSpeech.sln --force-evaluate

      - name: Commit generated dependency files
        run: |
          rm .github/workflows/dependency-refresh.yml
          git config user.name "Yevheniia"
          git config user.email "49581014+alikberova@users.noreply.github.com"
          git add -A
          git commit -m "Refresh project dependencies"
          git pull --rebase origin maintenance/dependency-refresh
          git push origin HEAD:maintenance/dependency-refresh
