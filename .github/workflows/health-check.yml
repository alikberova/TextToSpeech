name: Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *' # Runs day at 1 am

permissions:
  issues: write

env:
  environment: Staging

jobs:
  health_check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Backend health
        id: backend-check
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -f http://localhost:7058/health

      - name: Check Frontend health
        id: frontend-check
        if: always()
        run: curl -f https://texttospeech.duckdns.org

      - name: Notify if services are down
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.create({
                ...context.repo,
                title: 'Health Check Alert: some service/s are down',
                body: 'One or more services are down. Backend: ${{ steps.backend-check.outcome }}, frotend: ${{ steps.frontend-check.outcome }}. \nPlease investigate.',
                labels: ['alert', 'health-check']
            });
