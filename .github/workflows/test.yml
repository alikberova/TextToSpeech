name: Tests Execution

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        test_type: [ Selenium, Unit, Integration ]

    steps:
      - uses: actions/checkout@v7

      - name: Create .env file for tests
        env:
          github_ref: ${{ github.head_ref || github.ref_name }}
        run: |
          cp .env.example .env
          normalized_ref=$(echo "${github_ref}" | sed 's/\//-/g')
          IMAGE_TAG_VERSION="test-${normalized_ref}"
          echo "" >> .env
          echo "IMAGE_TAG_VERSION=$IMAGE_TAG_VERSION" >> .env
          echo "AppDataPath=$RUNNER_TEMP/tts-app" >> .env
          cat .env.test >> .env

      - name: Export environment variables from an env file
        uses: falti/dotenv-action@v1.2
        with:
          export-variables: true
          keys-case: bypass
          log-variables: true

      - name: Generate test SSL certs
        if: matrix.test_type == 'Selenium'
        run: |
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost" \
            -keyout $CERTS_PATH/privkey.pem \
            -out $CERTS_PATH/fullchain.pem

      - name: Build and start containers for tests
        if: matrix.test_type == 'Selenium'
        run: |
          export DOCKER_BUILDKIT=1
          docker compose build --build-arg BUILDKIT_INLINE_CACHE=1
          docker network create elk
          docker compose up -d

      - name: Cache NuGet Packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Override Redis for test runner
        if: matrix.test_type == 'Selenium'
        run: echo "ConnectionStrings__RedisConnection=localhost:6379,allowAdmin=true" >> $GITHUB_ENV

      - name: Run Tests
        run: dotnet test --no-restore --filter TextToSpeech.${{ matrix.test_type }}Tests

      - name: Show container logs
        if: matrix.test_type == 'Selenium' && failure()
        run: |
          docker logs db || true
          docker logs redis || true
          docker logs api || true
          docker logs web || true
  
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FRONTEND_DIR: TextToSpeech.Web
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npx ng lint

      - name: Unit tests
        run: |
          npx ng test --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage/**
          if-no-files-found: ignore
