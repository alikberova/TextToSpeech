name: Tests Execution

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        test_type: [ Selenium, Unit, Integration ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create .env file for tests
        env:
          github_ref: ${{ github.head_ref || github.ref_name }}
        run: |
          cp .env.example .env
          normalized_ref=$(echo "${github_ref}" | sed 's/\//-/g')
          IMAGE_TAG_VERSION="test-${normalized_ref}"
          echo "" >> .env
          echo "IMAGE_TAG_VERSION=$IMAGE_TAG_VERSION" >> .env
          echo "AppDataPath=$RUNNER_TEMP/tts-app" >> .env
          cat .env.test >> .env

      - name: Export environment variables from an env file
        uses: falti/dotenv-action@fff81fa3263fb96221c521b5e526e57c0c56d760 # v1.2
        with:
          export-variables: true
          keys-case: bypass
          log-variables: true

      - name: Generate test SSL certs
        if: matrix.test_type == 'Selenium'
        run: pwsh ./scripts/generate-cert.ps1

      - name: Log in to Docker Hub
        if: matrix.test_type == 'Selenium'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and start containers for tests
        if: matrix.test_type == 'Selenium'
        run: |
          export DOCKER_BUILDKIT=1
          docker compose build --build-arg BUILDKIT_INLINE_CACHE=1
          docker compose push
          docker network create elk
          docker compose up -d

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}

      - name: Restore dependencies
        run: dotnet restore

      # Ensure restore did not change committed NuGet lock files.
      - name: Verify NuGet lock files
        if: matrix.test_type == 'Unit'
        run: git diff --exit-code -- '**/packages.lock.json'

      - name: Override Redis for test runner
        if: matrix.test_type == 'Selenium'
        run: echo "ConnectionStrings__RedisConnection=localhost:6379,allowAdmin=true" >> $GITHUB_ENV

      - name: Run Tests
        run: dotnet test --no-restore --filter TextToSpeech.${{ matrix.test_type }}Tests

      - name: Show backend logs
        if: matrix.test_type == 'Selenium' && failure()
        run: |
          docker logs api || true
          docker logs worker || true
  
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FRONTEND_DIR: TextToSpeech.Web
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ${{ env.FRONTEND_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Unit tests
        run: |
          npm run test -- --coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: ${{ env.FRONTEND_DIR }}/coverage/**
          if-no-files-found: ignore
