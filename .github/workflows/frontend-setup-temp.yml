name: Temporary frontend setup

on:
  push:
    branches:
      - frontend-format-gitattributes

permissions:
  contents: write

jobs:
  setup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: frontend-format-gitattributes
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Restore TypeScript formatting
        run: |
          git fetch origin dev
          git restore --source=origin/dev -- ':(glob)TextToSpeech.Web/**/*.ts'

      - name: Update frontend lock file
        working-directory: TextToSpeech.Web
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TextToSpeech.Web
          git diff --cached --quiet && exit 0
          git commit -m "Restore TypeScript formatting and update Husky lock"
          git push
