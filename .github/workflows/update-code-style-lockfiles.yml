name: Apply configured C# formatting

on:
  push:
    branches:
      - enforce-code-style

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: enforce-code-style

      - name: Restore dependencies
        run: dotnet restore

      - name: Apply formatter
        run: dotnet format TextToSpeech.sln --no-restore

      - name: Commit formatter changes
        run: |
          git add '**/*.cs' '**/packages.lock.json'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Apply configured C# formatting"
          git push
