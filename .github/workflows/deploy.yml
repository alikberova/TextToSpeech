name: Deployment
run-name: "Deploy to ${{ inputs.environment }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        options:
          - staging
          - prod
        default: staging
        
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Create .env file
      # redeclare secrets for security reeasons
      env:
        ES_PASS: ${{ secrets.ELASTICSEARCHCONFIG__PASSWORD }}
        NARAKEET_KEY: ${{ secrets.NARAKEETCONFIG__APIKEY }}
        OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        RABBITMQ_CONNECTION_PASSWORD: ${{ secrets.RABBITMQ__RABBITMQCONNECTION__PASSWORD }}
        EMAIL_FROM: ${{ secrets.EMAILCONFIG__EMAILFROM }}
        EMAIL_PASS: ${{ secrets.EMAILCONFIG__EMAILFROMPASSWORD }}
        EMAIL_TO: ${{ secrets.EMAILCONFIG__EMAILTO }}
        JWT_SIGNING_KEY: ${{ secrets.JWTCONFIG__SIGNINGKEY }} 
      run: |
        echo "IMAGE_TAG_VERSION=${{ inputs.environment }}" > .env
        echo "ASPNETCORE_ENVIRONMENT=$(echo "${{ inputs.environment }}" | sed -E 's/^([a-zA-Z])/\U\1/')" >> .env # capitalize 1st letter
        echo "ANGULAR_ENVIRONMENT=${{ inputs.environment }}" >> .env
        echo "ANGULAR_PORT=${{ vars.ANGULAR_PORT }}" >> .env
        echo "APP_DATA_PATH=${{ vars.APP_DATA_PATH }}" >> .env
        echo "CERTS_PATH=${{ vars.CERTS_PATH }}" >> .env
        echo "ConnectionStrings__RedisConnection=${{ vars.ConnectionStrings__RedisConnection }}" >> .env
        echo "NARAKEETCONFIG__APIURL=${{ vars.NARAKEETCONFIG__APIURL }}" >> .env
        echo "ANGULAR_PORT=${{ vars.ANGULAR_PORT }}" >> .env
        echo "POSTGRES_USER=${{ vars.POSTGRES_USER }}" >> .env
        echo "POSTGRES_DB=${{ vars.POSTGRES_DB }}" >> .env
        echo "POSTGRES_EXPOSED_PORT=${{ vars.POSTGRES_EXPOSED_PORT }}" >> .env
        echo "RabbitMq__RabbitMqConnection__HostName=${{ vars.RABBITMQ__RABBITMQCONNECTION__HOSTNAME }}" >> .env
        echo "RabbitMq__RabbitMqConnection__Port=${{ vars.RABBITMQ__RABBITMQCONNECTION__PORT }}" >> .env
        echo "RabbitMq__RabbitMqConnection__UserName=${{ vars.RABBITMQ__RABBITMQCONNECTION__USERNAME }}" >> .env
        echo "RabbitMq__RabbitMqConnection__Password=$RABBITMQ_CONNECTION_PASSWORD" >> .env
        echo "RabbitMq__RabbitMqConnection__VirtualHost=${{ vars.RABBITMQ__RABBITMQCONNECTION__VIRTUALHOST }}" >> .env
        echo "RabbitMq__Exchange=${{ vars.RABBITMQ__EXCHANGE }}" >> .env
        echo "RabbitMq__Queue=${{ vars.RABBITMQ__QUEUE }}" >> .env
        echo "RabbitMq__RoutingKey=${{ vars.RABBITMQ__ROUTINGKEY }}" >> .env
        echo "RabbitMq__PublishTimeoutSeconds=${{ vars.RABBITMQ__PUBLISHTIMEOUTSECONDS }}" >> .env
        echo "RabbitMq__PollIntervalSeconds=${{ vars.RABBITMQ__POLLINTERVALSECONDS }}" >> .env
        echo "RabbitMq__RetryDelaySeconds=${{ vars.RABBITMQ__RETRYDELAYSECONDS }}" >> .env
        echo "Worker__Concurrency=${{ vars.WORKER__CONCURRENCY }}" >> .env
        echo "Worker__LeaseSeconds=${{ vars.WORKER__LEASESECONDS }}" >> .env
        echo "Worker__HeartbeatSeconds=${{ vars.WORKER__HEARTBEATSECONDS }}" >> .env
        echo "Worker__RecoveryIntervalSeconds=${{ vars.WORKER__RECOVERYINTERVALSECONDS }}" >> .env
        echo "ELASTICSEARCHCONFIG__URL=${{ vars.ELASTICSEARCHCONFIG__URL }}" >> .env
        echo "JwtConfig__Issuer=${{ vars.JWTCONFIG__ISSUER }}" >> .env
        echo "JwtConfig__Audience=${{ vars.JWTCONFIG__AUDIENCE }}" >> .env
        echo "JwtConfig__GuestLifetimeMinutes=${{ vars.JWTCONFIG__GUESTLIFETIMEMINUTES }}" >> .env
        echo "ConnectionStrings__DefaultConnection=User ID=${{ vars.POSTGRES_USER }};Password=$POSTGRES_PASSWORD;Host=db;Port=5432;Database=${{ vars.POSTGRES_DB }};Pooling=true;Include Error Detail=true;" >> .env

        echo "ELASTICSEARCHCONFIG__PASSWORD=$ES_PASS" >> .env
        echo "NARAKEETCONFIG__APIKEY=$NARAKEET_KEY" >> .env
        echo "OPENAI_API_KEY=$OPENAI_KEY" >> .env
        echo "ELEVENLABS_API_KEY=$ELEVENLABS_API_KEY" >> .env
        echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
        echo "EMAILCONFIG__EMAILFROM=$EMAIL_FROM" >> .env
        echo "EMAILCONFIG__EMAILFROMPASSWORD=$EMAIL_PASS" >> .env
        echo "EMAILCONFIG__EMAILTO=$EMAIL_TO" >> .env
        echo "JwtConfig__SigningKey=$JWT_SIGNING_KEY" >> .env

    - name: Build and Push Docker Compose services
      run: |
        docker compose build
        docker compose push

    - name: Copy files to server
      uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master
      with:
        host: ${{ vars.TTS_SERVER_HOST }}
        username: ${{ vars.TTS_SERVER_USER }}
        key: ${{ secrets.TTS_SERVER_SSH_PRIVATE_KEY }}
        source: docker-compose.yml,.env
        target: ${{ vars.APP_DATA_PATH }}

    - name: Deploy to Server
      uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
      with:
        host: ${{ vars.TTS_SERVER_HOST }}
        username: ${{ vars.TTS_SERVER_USER }}
        key: ${{ secrets.TTS_SERVER_SSH_PRIVATE_KEY }}
        script: |
          printf '%s' '${{ secrets.DOCKER_TOKEN }}' \
            | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
          cd ${{ vars.APP_DATA_PATH }}
          docker network inspect elk >/dev/null 2>&1 || docker network create elk
          docker compose pull
          docker compose down --remove-orphans || true
          docker compose up -d --force-recreate
